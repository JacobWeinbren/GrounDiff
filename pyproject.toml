[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "groundiff"
version = "0.3.0"
description = "GrounDiff (WACV 2026) and ResDepth for LiDAR DTM production: lasground_new result -> hand-edited DTM, editing priorities, QGIS/LP360 outputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "laspy[lazrs]>=2.5",
    "triangle>=20230923",          # fast Delaunay for the ground TIN (free for private, research and institutional use)
    "rasterio>=1.3",
    "requests>=2.28",              # laspy reads COPC tiles over HTTP with it (groundiff.data.select)
]

[project.optional-dependencies]
train = ["torch>=2.3"]
onnx = ["onnx>=1.15", "onnxruntime>=1.17", "onnxscript"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["groundiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
